aid: bold-metrics
name: Bold Metrics
description: 'Bold Metrics is an AI body data platform for the apparel and fashion
  industry that uses digital-twin technology to power apparel fit and sizing. From
  just 4-6 simple body-data inputs it predicts 50+ individual body measurements with
  tailor-level accuracy, without photos, scanning, or measuring tapes. Its products
  - Smart Size Chart, Virtual Sizer, Virtual Tailor, Apparel Insights, and the Agentic
  Sizing Protocol - help brands reduce returns, lift conversion, and increase average
  order value with personalized size recommendations. The Agentic Sizing Protocol
  exposes this capability to AI shopping agents while keeping retailer API credentials
  off the agent and out of any LLM. Bold Metrics has processed 250M+ digital twins
  and 12B+ body-data points. Backed by Bessemer Venture Partners and Techstars. This
  profile is maintained in the API Evangelist network; Bold Metrics publishes no
  public API documentation - integration is gated behind a demo/partner engagement.'
